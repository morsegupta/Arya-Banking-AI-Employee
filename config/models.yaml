# Model per role (architecture §10, ADR-10). All served by Groq's OpenAI-compatible API.
# Swap any role to another OpenAI-compatible model by editing this file.
provider:
  base_url: vault://GROQ_BASE_URL
  api_key: vault://GROQ_API_KEY

roles:
  mission:      { model: openai/gpt-oss-120b, reasoning_effort: high,   max_tokens: 4000 }
  # Planning writes a long JSON plan: medium reasoning leaves room for it under the output cap
  # (high reasoning used the whole 4000-token cap live and the JSON never came). Code validates plans.
  mission_plan: { model: openai/gpt-oss-120b, reasoning_effort: medium, max_tokens: 5500 }
  verifier:     { model: openai/gpt-oss-120b, reasoning_effort: high,   max_tokens: 3000 }
  operator:     { model: openai/gpt-oss-120b, reasoning_effort: medium, max_tokens: 2000 }
  conversation: { model: openai/gpt-oss-120b, reasoning_effort: medium, max_tokens: 2000 }
  light:        { model: qwen/qwen3.8-27b,                              max_tokens: 1500 }
  simulator:    { model: qwen/qwen3.8-27b,                              max_tokens: 1200, temperature: 0.7 }
  guard:        { model: meta-llama/llama-prompt-guard-2-86m }
