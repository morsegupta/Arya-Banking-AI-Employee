# Seeded world: Sharma Distributors, default scenario.
#
# One file feeds every sandbox system (ERP, bank portal, message hub, drive).
# Amounts are whole rupees here; systems store integer paise.
#
# `hidden:` blocks are GROUND TRUTH for the customer simulator and the eval
# harness only. The seed never writes them into the ERP, bank, hub or drive,
# so the agent can never read them.

world_id: sharma_default

# How evals/ run this world: the brief a manager gives, how many days, what must hold at the end.
eval:
  brief: "Collect the 45+ day overdue invoices — target ₹12L by Friday."
  days: 5
  humans: { concession: reject }      # the manager says no to discounts each morning
  expect: { status: "ACTIVE|COMPLETED|ESCALATED" }
start: "2026-10-19T10:00:00+05:30"   # Monday, after contact hours open (09:30). Mission week ends Friday 2026-10-23.

