{% extends "base.html" %}
{% block title %}Record receipt — {{ inv.number }}{% endblock %}
{% block content %}
<h1>Record receipt for {{ inv.number }}</h1>
<p>{{ inv.customer_name }} · Balance due <strong>{{ inv.balance_paise|inr }}</strong></p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/invoices/{{ inv.number }}/receipts" aria-label="Receipt">
  <label for="receipt_date">Receipt date</label>
  <input id="receipt_date" name="receipt_date" type="date" value="{{ today.isoformat() }}" required>
  <label for="amount">Amount (₹)</label>
  <input id="amount" name="amount" inputmode="decimal" required>
  <label for="mode">Payment mode</label>
  <select id="mode" name="mode">{% for m in modes %}<option value="{{ m }}">{{ m }}</option>{% endfor %}</select>
  <label for="reference">Bank reference / UTR</label>
  <input id="reference" name="reference" required>
  <label for="remarks">Remarks</label>
  <input id="remarks" name="remarks">
  <p><button type="submit">Post receipt</button> <a href="/invoices/{{ inv.number }}">Cancel</a></p>
</form>
{% endblock %}
