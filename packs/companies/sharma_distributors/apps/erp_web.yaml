name: erp_web
title: Sharma Distributors Mini ERP — web UI (receipt posting is web-only)
base_url: http://127.0.0.1:8101
read_only: false
login:
  path: /login
  fields:
    Username: vault://ERP_WEB_USER
    Password: vault://ERP_WEB_PASSWORD
  submit: Log in
logout_path: /logout
deny_paths: [/api/]                  # use the REST connector for reads, not the browser
notes:
  - Each invoice page has a "Record receipt" link while the invoice is open.
  - The receipt form needs date, amount, payment mode and bank reference / UTR.
