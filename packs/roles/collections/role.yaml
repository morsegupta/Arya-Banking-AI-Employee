# Role Pack: collections (Arya). Data, not code: the runtime reads this file.
name: collections
title: Accounts Receivable & Collections employee
entity: invoice
value_unit: paise                 # entity.value and money facts are integer paise

pipeline:
  states: [OVERDUE, CONTACTED, ACKNOWLEDGED, PROMISED, PARTIALLY_PAID, PAID,
           BROKEN_PROMISE, DISPUTED, NO_RESPONSE, ESCALATED, WRITTEN_OFF]
  initial: [OVERDUE]
  terminal: [PAID, WRITTEN_OFF]
  constants:
    tolerance: 100                # paise: bank vs ERP rounding allowed when matching
    min_confidence: 0.8
  timer_time_of_day: "10:00"
  transitions:
    - from: OVERDUE
      to: CONTACTED
      guard: { all: [ "outreach.delivered == true", "outreach.message_id exists" ] }

    - from: CONTACTED
      to: ACKNOWLEDGED
      guard: { all: [ "classifier.about_entity == true", "evidence.quote exists" ] }

    - from: [CONTACTED, ACKNOWLEDGED]
      to: PROMISED
      guard: { all: [ "classifier.intent == 'promise_to_pay'", "classifier.confidence >= min_confidence",
                      "facts.promise_amount > 0", "facts.promise_date exists", "evidence.quote exists" ,
                      "verifier.pass == true" ] }

    - from: ACKNOWLEDGED
      to: DISPUTED
      guard: { all: [ "classifier.intent == 'dispute'", "classifier.confidence >= min_confidence",
                      "evidence.quote exists" ] }

    # "Paid" needs money in the bank, matched to this invoice, and an ERP receipt, and the Verifier.
    # A customer's claim alone can never satisfy this guard.
    - from: [OVERDUE, CONTACTED, ACKNOWLEDGED, PROMISED, PARTIALLY_PAID, BROKEN_PROMISE]
      to: PAID
      guard: { all: [ "matcher.matched_amount >= entity.balance - tolerance", "matcher.counterparty_matches == true",
                      "matcher.record_id exists", "erp.receipt_exists == true", "verifier.pass == true" ] }

    - from: [PROMISED, CONTACTED, ACKNOWLEDGED]
      to: PARTIALLY_PAID
      guard: { all: [ "matcher.matched_amount > 0", "matcher.matched_amount < entity.balance - tolerance",
                      "matcher.counterparty_matches == true", "erp.receipt_exists == true", "verifier.pass == true" ] }

    # A new promise replaces the old one (later date after a reminder, different amount): same evidence
    # bar as the first promise; the reminder and the broken-promise check move to the new date.
    - from: PROMISED
      to: PROMISED
      guard: { all: [ "classifier.intent == 'promise_to_pay'", "classifier.confidence >= min_confidence",
                      "facts.promise_amount > 0", "facts.promise_date exists", "evidence.quote exists",
                      "verifier.pass == true" ] }

    - from: PARTIALLY_PAID
      to: PROMISED
      guard: { all: [ "classifier.intent == 'promise_to_pay'", "classifier.confidence >= min_confidence",
                      "facts.promise_amount > 0", "facts.promise_date exists", "evidence.quote exists" ,
                      "verifier.pass == true" ] }

    - from: PROMISED
      to: BROKEN_PROMISE
      actor: system
      guard: "matcher.matched_amount == 0"

    - from: CONTACTED
      to: NO_RESPONSE
      actor: system

    - from: BROKEN_PROMISE
      to: CONTACTED
      guard: { all: [ "outreach.delivered == true", "outreach.message_id exists" ] }

    - from: [ACKNOWLEDGED, DISPUTED, NO_RESPONSE, BROKEN_PROMISE]
      to: ESCALATED

    - from: ESCALATED
      to: WRITTEN_OFF
      actor: human

timers:
  - { on: CONTACTED, at: "entered_at + 3d", do: timer.followup_due, name: followup }
  - { on: PROMISED,  at: "facts.promise_date - 1d", do: timer.promise_reminder_due, name: reminder, min_lead: 12h }
  - { on: PROMISED,  at: "facts.promise_date + 2d", do: timer.promise_check_due, name: check }

task_types:
  fetch_open_items:   { apps: [erp_api], goal: "List open invoices that match the mission scope" }
  download_statement: { apps: [bank_portal, files], goal: "Download the bank statement CSV for a date range" }
  outreach:           { apps: [email, whatsapp, files], goal: "Send a reminder for one invoice" }
  post_receipt:
    apps: [erp_web]
    goal: "Record a matched payment against an invoice in the ERP"
    goal_template: >-
      In the ERP web app, record a receipt against invoice {ref}: amount {amount}, receipt date {date},
      payment mode {mode}, bank reference / UTR {reference}. Use the invoice's "Record receipt" form
      (path /invoices/{ref}/receipts/new) and submit it once.
    success_criteria: ["the ERP shows 'Receipt RCPT-... posted' on the invoice page"]

# How an entity is loaded from the system of record, and what of it the employee may say.
entity_source:
  detail_tool: erp.get_invoice
  detail_arg: number
  external_ref: number
  value: balance_paise
  facts: [number, customer_id, customer_name, issue_date, due_date, days_overdue, total_paise, balance_paise, status]
  money_facts: [total_paise, balance_paise]     # shown to the Conversation Agent formatted as ₹
  documents: [pdf_path]                         # fields holding shared-drive paths
  counterparty:
    tool: erp.get_customer
    arg: customer_id
    from_fact: customer_id
    name: contact_name
    email: contact_email
    whatsapp: contact_whatsapp

outreach:
  purpose: "First reminder for an overdue invoice: ask the customer for a payment date."
  channel_order: [email, whatsapp]

prompts:
  operator: prompts/operator.md
  conversation: prompts/conversation.md
  mission: prompts/mission.md
  verifier: prompts/verifier.md

# Reply Classifier slot: the intents this role recognises in counterparty messages.
reply_classifier:
  minor_units: 100                # amounts in replies are rupees; entity values are paise
  intents:
    promise_to_pay: "commits to pay a stated amount on or by a stated date"
    paid_claim: "says the payment has already been made"
    dispute: "contests the invoice: quantity, price, quality or delivery"
    doc_request: "asks for a copy of the invoice, statement or another document"
    discount_request: "asks for a discount, waiver or better terms"
    bank_detail_change: "asks to pay to different bank details, or says the supplier's details changed"
    not_now: "acknowledges the message without any commitment"
    opt_out: "asks the company to stop contacting them"
    unclear: "none of the above, or cannot tell"

# Verifier settings (deterministic checks always; a second LLM opinion only when needed).
verification:
  promise:
    max_days_ahead: 60
    second_opinion_below: 0.9      # classifier confidence below this -> Verifier judges the message too

# Matching money records (bank statement lines) to entities.
reconciliation:
  states: [OVERDUE, CONTACTED, ACKNOWLEDGED, PROMISED, PARTIALLY_PAID, BROKEN_PROMISE]
  counterparty_field: customer_name
  order_field: due_date           # allocation order when one payment covers several invoices
  lookback_days: 21

# --- Mission level (Day 2) -------------------------------------------------------------------------

mission:
  # Which entities a brief can select. The Mission Agent sets `params`; code applies `fixed` and
  # `exclude` on top, so a brief can never pull in something policy forbids.
  selection:
    list_tool: erp.list_invoices
    list_key: invoices
    fixed: { status: "OPEN,PARTIALLY_PAID" }
    params:
      min_days_overdue: { type: integer, description: "Only invoices at least this many days past their due date" }
      max_days_overdue: { type: integer, description: "Only invoices at most this many days past their due date" }
      customer_id: { type: string, description: "Only this customer (ERP customer id, e.g. C02)" }
    group_tool: erp.list_customers   # the counterparties; one contact covers all of a customer's invoices
    group_key: customer_id
    exclude:
      - { when: "group.legal_hold == true", reason: "customer on legal hold: only the legal team may contact them" }
      - { when: "group.payment_plan == true", reason: "customer is on an agreed payment plan" }
      - { when: "item.status == 'DISPUTED'", reason: "invoice is under dispute" }
      - { when: "item.days_overdue <= 0", reason: "invoice is not yet due" }

  success_criteria:
    - "Only money matched in the bank, posted as an ERP receipt and verified counts towards the target"

  capacity_per_day: 6              # customers contacted for the first time per day
  minor_units: 100                 # targets in briefs are rupees

  # Probability that value in each state turns into verified money by a week-long deadline (forecast
  # prior; memory will replace it with this company's own history).
  forecast_weights: { OVERDUE: 0.35, CONTACTED: 0.45, ACKNOWLEDGED: 0.5, PROMISED: 0.8, PARTIALLY_PAID: 0.6,
                      BROKEN_PROMISE: 0.25, NO_RESPONSE: 0.1, DISPUTED: 0.0, ESCALATED: 0.1 }

  approaches:
    soft_reminder:
      description: "Friendly reminder with the invoice copies. For a single, not very old invoice."
      purpose: "Friendly reminder for the overdue invoice(s) listed: ask the customer for a payment date."
      documents: [entity]
    firm_with_statement:
      description: "Firm, polite reminder with a statement of account attached. For several overdue invoices or very old balances."
      purpose: >-
        Firm but polite reminder: the invoice(s) listed are well past due. A statement of account is
        attached. Ask the customer to confirm a payment date for the full balance.
      documents: [entity, statement_of_account]

  # What the Mission Agent may ask for on a tick. `states`: the lever applies to groups with an entity
  # in one of these states. The runtime executes levers; some need human approval.
  max_replans_per_day: 2           # extra reviews triggered by failures (L3), on top of the daily one
  token_budget: 500000             # whole mission; paused for a human when spent

  levers:
    retry_contact:
      description: "Contact a customer whose first message failed (all channels), trying again now."
      states: [OVERDUE]
    follow_up:
      description: "Send a follow-up on the next channel to a customer who has not replied."
      states: [CONTACTED]
    send_statement:
      description: "Send the customer a statement of account of all their open invoices."
      states: [CONTACTED, ACKNOWLEDGED, BROKEN_PROMISE]
    re_engage:
      description: "Contact a customer again after a broken promise (once)."
      states: [BROKEN_PROMISE]
    escalate:
      description: "Hand the customer to a human (account manager) with the evidence so far."
      states: [ACKNOWLEDGED, DISPUTED, NO_RESPONSE, BROKEN_PROMISE]
    propose_payment_plan:
      description: "Ask the finance manager to approve offering an instalment plan to this customer."
      states: [ACKNOWLEDGED, BROKEN_PROMISE, NO_RESPONSE]
      needs_approval: true
      action: payment_plan
      grants_phrases: [instalment, installment, payment plan]
    check_bank:
      description: "Download a fresh bank statement now and reconcile."
      needs_groups: false

prioritizer:
  fields: { ref: number, group: customer_id, group_name: customer_name, value: balance_paise, age: days_overdue }
  weights: { value: 0.5, age: 0.3, risk: 0.2 }
  risk_signals: { multi: 0.4, contested_before: 0.4, old: 0.2 }
  contested_statuses: [DISPUTED]   # a customer with such invoices has contested before
  old_after_days: 75
  approach_rules:
    - { when: "group.multi == true", approach: firm_with_statement }
    - { when: "group.max_age >= 75", approach: firm_with_statement }
  default_approach: soft_reminder

documents:
  statement_of_account:
    title: "STATEMENT OF ACCOUNT"
    folder: statements             # on the shared drive
    filename: "SOA-{group}-{date}.pdf"
    list_tool: erp.list_invoices
    list_args: { customer_id: "{group}", status: "OPEN,PARTIALLY_PAID" }
    list_key: invoices
    group_name_field: customer_name
    issuer: ["{company_name}", "Accounts Receivable · {ar_email} · {ar_whatsapp}"]
    fields:
      - ["Customer", "{group_name} ({group})"]
      - ["Statement date", "{date}"]
    columns:
      - { key: number, label: "Invoice", width: 28 }
      - { key: issue_date, label: "Invoice date", width: 28 }
      - { key: due_date, label: "Due date", width: 28 }
      - { key: days_overdue, label: "Days overdue", width: 26, align: R }
      - { key: total_paise, label: "Amount", width: 38, align: R }
      - { key: balance_paise, label: "Balance due", width: 40, align: R }
    money: [total_paise, balance_paise]
    totals:
      - ["Total balance due", "balance_paise"]
    notes:
      - "Please pay to {bank_account_name}, {bank_name}, A/c {bank_account_number}, IFSC {bank_ifsc}."
      - "Quote the invoice numbers in the payment remarks and send the UTR to {ar_email}."
      - "Our bank details never change by email or message."
