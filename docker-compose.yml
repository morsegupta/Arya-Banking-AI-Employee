# Sandbox company: Sharma Distributors.
#   docker compose up --build
# `seed` resets var/ from the world file, then the three services start on the shared volume.

x-sandbox: &sandbox
  build: .
  env_file: [{ path: .env, required: false }]
  environment:
    SANDBOX_VAR_DIR: /data
  volumes:
    - sandbox-data:/data

services:
  seed:
    <<: *sandbox
    command: ["python", "-m", "sandbox.seed"]
    restart: "no"

  erp:
    <<: *sandbox
    command: ["uvicorn", "sandbox.erp.app:app", "--host", "0.0.0.0", "--port", "8101"]
    ports: ["8101:8101"]
    depends_on: { seed: { condition: service_completed_successfully } }

  bank_portal:
    <<: *sandbox
    command: ["uvicorn", "sandbox.bank_portal.app:app", "--host", "0.0.0.0", "--port", "8102"]
    ports: ["8102:8102"]
    depends_on: { seed: { condition: service_completed_successfully } }

  message_hub:
    <<: *sandbox
    command: ["uvicorn", "sandbox.message_hub.app:app", "--host", "0.0.0.0", "--port", "8103"]
    ports: ["8103:8103"]
    depends_on: { seed: { condition: service_completed_successfully } }

volumes:
  sandbox-data:
