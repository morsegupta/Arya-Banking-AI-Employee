[project]
name = "operator-runtime"
version = "0.1.0"
description = "Operator: a domain-agnostic AI-employee runtime (Arya, collections) plus its sandbox company"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "playwright>=1.64.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = []
